- title: Example 1
  content: |-
    Loading `Sentinel-2B` data from a `Sentinel-2` collection for 2018, but only with cloud cover between 0 and 50%.

    Example arguments for calling `load_collection`.
  snippets:
  - language: json
    code: |-
      {
        "id": "Sentinel-2",
        "spatial_extent": {
          "west": 16.1,
          "east": 16.6,
          "north": 48.6,
          "south": 47.2
        },
        "temporal_extent": [
          "2018-01-01",
          "2019-01-01"
        ],
        "properties": {
          "eo:cloud_cover": {
            "process_graph": {
              "cc": {
                "process_id": "between",
                "arguments": {
                  "x": {
                    "from_parameter": "value"
                  },
                  "min": 0,
                  "max": 50
                },
                "result": true
              }
            }
          },
          "platform": {
            "process_graph": {
              "pf": {
                "process_id": "eq",
                "arguments": {
                  "x": {
                    "from_parameter": "value"
                  },
                  "y": "Sentinel-2B",
                  "case_sensitive": false
                },
                "result": true
              }
            }
          }
        }
      }
