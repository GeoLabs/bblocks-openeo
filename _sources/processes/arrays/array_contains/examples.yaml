- title: Example 1
  content: |-
    Calling `array_contains` with these arguments returns `true`.
  snippets:
  - language: json
    code: |-
      {
        "data": [
          1,
          2,
          3
        ],
        "value": 2
      }
- title: Example 2
  content: |-
    Calling `array_contains` with these arguments returns `false`.
  snippets:
  - language: json
    code: |-
      {
        "data": [
          "A",
          "B",
          "C"
        ],
        "value": "b"
      }
