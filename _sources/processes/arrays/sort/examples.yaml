- title: Example 1
  content: |-
    Calling `sort` with these arguments returns `[-1, 2, 3, 4, 6, 7, 8, 9, 9]`.
  snippets:
  - language: json
    code: |-
      {
        "data": [
          6,
          -1,
          2,
          null,
          7,
          4,
          null,
          8,
          3,
          9,
          9
        ]
      }
- title: Example 2
  content: |-
    Calling `sort` with these arguments returns `[9, 9, 8, 7, 6, 4, 3, 2, -1, null, null]`.
  snippets:
  - language: json
    code: |-
      {
        "data": [
          6,
          -1,
          2,
          null,
          7,
          4,
          null,
          8,
          3,
          9,
          9
        ],
        "asc": false,
        "nodata": true
      }
