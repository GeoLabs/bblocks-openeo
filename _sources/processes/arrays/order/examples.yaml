- title: Example 1
  content: |-
    Calling `order` with these arguments returns `[1, 2, 8, 5, 0, 4, 7, 9, 10]`.
  snippets:
  - language: json
    code: |-
      {
        "data": [
          6,
          -1,
          2,
          null,
          7,
          4,
          null,
          8,
          3,
          9,
          9
        ]
      }
