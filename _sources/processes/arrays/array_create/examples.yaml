      {}
- title: Example 2
  content: |-
    Calling `array_create` with these arguments returns `["this", "is", "a", "test"]`.
  snippets:
  - language: json
    code: |-
      {
        "data": [
          "this",
          "is",
          "a",
          "test"
        ]
      }
- title: Example 3
  content: |-
