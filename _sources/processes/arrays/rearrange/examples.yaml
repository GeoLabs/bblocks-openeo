- title: Reverse a list
  content: |-
    Calling `rearrange` with these arguments returns `[3, 4, 5]`.
  snippets:
  - language: json
    code: |-
      {
        "data": [
          5,
          4,
          3
        ],
        "order": [
          2,
          1,
          0
        ]
      }
- title: Remove two elements
  content: |-
    Calling `rearrange` with these arguments returns `[4, 2]`.
  snippets:
  - language: json
    code: |-
      {
        "data": [
          5,
          4,
          3,
          2
        ],
        "order": [
          1,
          3
        ]
      }
- title: Swap two elements
  content: |-
    Calling `rearrange` with these arguments returns `[5, 3, 4, 2]`.
  snippets:
  - language: json
    code: |-
      {
        "data": [
          5,
          4,
          3,
          2
        ],
        "order": [
          0,
          2,
          1,
          3
        ]
      }
