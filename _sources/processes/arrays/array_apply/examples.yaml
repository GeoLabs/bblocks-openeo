- title: Apply absolute() to each element
  content: |-
    Applies the `absolute` process to each element of the array.

    Calling `array_apply` with these arguments returns `[1, 2, 3]`.
  snippets:
  - language: json
    code: |-
      {
        "data": [
          -1,
          2,
          -3
        ],
        "process": {
          "process_graph": {
            "abs1": {
              "process_id": "absolute",
              "arguments": {
                "x": {
                  "from_parameter": "x"
                }
              },
              "result": true
            }
          }
        }
      }
