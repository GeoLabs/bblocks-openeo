- title: Example 1
  content: |-
    Calling `array_interpolate_linear` with these arguments returns `[null, 1, 3.5, 6, -1, -8]`.
  snippets:
  - language: json
    code: |-
      {
        "data": [
          null,
          1,
          null,
          6,
          null,
          -8
        ]
      }
- title: Example 2
  content: |-
    Calling `array_interpolate_linear` with these arguments returns `[null, 1, null, null]`.
  snippets:
