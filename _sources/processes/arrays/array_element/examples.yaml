- title: Example 1
  content: |-
    Calling `array_element` with these arguments returns `7`.
  snippets:
  - language: json
    code: |-
      {
        "data": [
          9,
          8,
          7,
          6,
          5
        ],
        "index": 2
      }
- title: Example 2
  content: |-
    Calling `array_element` with these arguments returns `"A"`.
  snippets:
  - language: json
    code: |-
      {
        "data": [
          "A",
          "B",
          "C"
        ],
        "index": 0
      }
- title: Example 3
  content: |-
    Calling `array_element` with these arguments returns `null`.
  snippets:
  - language: json
    code: |-
      {
        "data": [],
        "index": 0,
        "return_nodata": true
      }
