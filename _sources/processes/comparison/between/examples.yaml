- title: Example 1
  content: |-
    Calling `between` with these arguments returns `null`.
  snippets:
  - language: json
    code: |-
      {
        "x": null,
        "min": 0,
        "max": 1
      }
- title: Example 2
  content: |-
    Calling `between` with these arguments returns `true`.
  snippets:
  - language: json
    code: |-
      {
        "x": 1,
        "min": 0,
        "max": 1
      }
- title: Example 3
  content: |-
    Calling `between` with these arguments returns `false`.
  snippets:
  - language: json
    code: |-
      {
        "x": 1,
        "min": 0,
        "max": 1,
        "exclude_max": true
      }
- title: Example 4
  content: |-
    Swapped bounds (min is greater than max) MUST always return `false`.

    Calling `between` with these arguments returns `false`.
  snippets:
  - language: json
    code: |-
      {
        "x": 0.5,
        "min": 1,
        "max": 0
      }
- title: Example 5
  content: |-
    Calling `between` with these arguments returns `true`.
  snippets:
  - language: json
    code: |-
      {
        "x": -0.5,
        "min": -1,
        "max": 0
      }
