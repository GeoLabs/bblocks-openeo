- title: Example 1
  content: |-
    Calling `median` with these arguments returns `6`.
  snippets:
  - language: json
    code: |-
      {
        "data": [
          1,
          3,
          3,
          6,
          7,
          8,
          9
        ]
      }
- title: Example 2
  content: |-
    Calling `median` with these arguments returns `4.5`.
  snippets:
  - language: json
    code: |-
      {
        "data": [
          1,
          2,
          3,
          4,
          5,
          6,
          8,
          9
        ]
      }
- title: Example 3
  content: |-
    Calling `median` with these arguments returns `-0.5`.
  snippets:
  - language: json
    code: |-
      {
        "data": [
          -1,
          -0.5,
          null,
          1
        ]
      }
- title: Example 4
  content: |-
    Calling `median` with these arguments returns `null`.
  snippets:
  - language: json
    code: |-
      {
        "data": [
          -1,
          0,
          null,
          1
        ],
        "ignore_nodata": false
      }
